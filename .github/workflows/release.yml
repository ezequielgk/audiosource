name: Release Audio Source Client

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build Rust Binary
        run: |
          cd desktop
          cargo build --release
        
      - name: Prepare Linux Client Package
        run: |
          # Create a staging directory
          mkdir -p package/audiosource-linux
          
          # Copy all necessary files
          cp desktop/target/release/desktop-rs package/audiosource-linux/audiosource
          chmod +x package/audiosource-linux/audiosource
          cp -r assets package/audiosource-linux/
          cp install.sh package/audiosource-linux/
          cp install-void.sh package/audiosource-linux/
          
          # Create the tarball
          cd package
          tar -czvf audiosource-linux.tar.gz audiosource-linux/
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly Build' }}
          files: package/audiosource-linux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
